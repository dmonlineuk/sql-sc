name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test tests/SqlSc.Core.Tests --no-build
      # Integration tests need Linux containers (SQL Server 2022 via Testcontainers).
      - if: runner.os == 'Linux'
        run: dotnet test tests/SqlSc.IntegrationTests --no-build

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/SqlSc.Cli -p:PublishProfile=win-x64
      - run: dotnet publish src/SqlSc.Cli -p:PublishProfile=linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sql-sc-win-x64
          path: artifacts/publish/win-x64/sql-sc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sql-sc-linux-x64
          path: artifacts/publish/linux-x64/sql-sc
